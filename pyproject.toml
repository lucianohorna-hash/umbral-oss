[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "narracion-multimundo"
version = "0.1.0"
description = "Motor local de universos narrativos persistentes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "sqlalchemy>=2.0,<2.1", "pydantic>=2.10,<3",
  "alembic>=1.14,<2", "uvicorn>=0.34,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
cloud = ["psycopg[binary]>=3.2,<4"]
chatgpt = ["mcp>=2.3,<3"]
chatgpt-plan = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
multimundo = "narrative.cli:main"

[tool.setuptools.packages.find]
include = ["narrative*", "migrations*"]

[tool.setuptools.package-data]
narrative = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
